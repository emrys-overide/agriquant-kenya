services:
  - type: static
    name: agriquant-kenya
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build"
    publishPath: "frontend/out"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    headers:
      - path: "/*"
        name: "Cache-Control"
        value: "public, max-age=0, must-revalidate"

  - type: web
    name: agriquant-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agriquant-db
          property: connectionString
      - key: WEATHER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://agriquant-kenya.pages.dev,https://agriquant-kenya.onrender.com"

databases:
  - name: agriquant-db
    databaseName: agriquant
    user: agriquant_user
    plan: free
