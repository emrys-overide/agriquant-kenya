name: Security and backend regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt urllib3
      - name: Compile Python sources
        run: python -m py_compile main.py api-worker/src/index.py
      - name: Run test suite with pytest
        env:
          PYTHONPATH: .
        run: python -m pytest tests -v
